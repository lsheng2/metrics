name: lsheng2-ui-design

on:
  pull_request:
  workflow_dispatch:

jobs:
  ui-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run project UI gate
        shell: pwsh
        run: scripts\validate_ui_design_gate.ps1 -Broad
