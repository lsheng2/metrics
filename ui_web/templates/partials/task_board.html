<div class="board" role="region" aria-label="Task board" tabindex="0">
    {% for column in columns %}
    <section class="board__column" aria-labelledby="board-column-{{ forloop.counter }}">
        <header class="board__header">
            <h3 class="board__title" id="board-column-{{ forloop.counter }}">{{ column.name }}</h3>
            <span class="count-badge">{{ column.count }}</span>
        </header>
        <ol class="board__cards">
            {% for task in column.items %}
            <li>{% include "partials/task_card.html" %}</li>
            {% empty %}
            <li class="board__empty">No tasks</li>
            {% endfor %}
        </ol>
    </section>
    {% endfor %}
</div>
