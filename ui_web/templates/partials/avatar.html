{% load avatar_filters %}<span class="avatar{% if avatar_size %} is-{{ avatar_size }}{% endif %}" data-palette-slot="{{ person.display_name|avatar_slot }}"{% if avatar_labelled %} role="img" aria-label="{{ person.display_name }}" title="{{ person.display_name }}"{% else %} aria-hidden="true"{% endif %}>{{ person.display_name|initials }}{% if person.avatar_url %}<img class="avatar__image" src="{{ person.avatar_url }}" alt="" loading="lazy">{% endif %}</span>
