<section class="card chart-card" aria-labelledby="team-sp-chart-title">
    <header class="card-header">
        <h3 class="card-header-title" id="team-sp-chart-title">Resolved story points<span class="card-header-meta">per month</span></h3>
    </header>
    <div class="chart-card__body">
        {% if month_sp %}
            <div class="chart-frame">
                <canvas id="teamStoryPointsChart" role="img" aria-label="Resolved story points per month"></canvas>
            </div>
        {% else %}
            <div class="empty-state">
                <span class="empty-state__icon"><i class="iconoir-stat-up" aria-hidden="true"></i></span>
                <p class="empty-state__title">No resolved story points</p>
                <p class="empty-state__body">Story points appear here once estimated work is resolved.</p>
            </div>
        {% endif %}
    </div>
</section>
{% if month_sp %}
<script>
(function() {
    function initTeamStoryPointsChart() {
        if (typeof Chart === 'undefined') {
            setTimeout(initTeamStoryPointsChart, 100);
            return;
        }
        if (window.teamStoryPointsChartInstance) {
            window.teamStoryPointsChartInstance.destroy();
            window.teamStoryPointsChartInstance = null;
        }
        const canvas = document.getElementById('teamStoryPointsChart');
        if (!canvas) return;
        const chartData = {{ month_sp|safe }};
        const barColor = index => () => window.DashboardCharts.paletteColor(index);
        window.teamStoryPointsChartInstance = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: {
                labels: chartData.labels,
                datasets: chartData.data.map((item, index) => ({
                    label: item.developer,
                    data: item.metrics,
                    backgroundColor: barColor(index),
                    hoverBackgroundColor: barColor(index)
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                onHover: window.DashboardVelocity.pointerOnHover,
                onClick: (event, elements) => {
                    if (elements.length) window.DashboardVelocity.openPeriod(chartData.labels[elements[0].index]);
                },
                scales: {
                    x: { grid: { display: false } },
                    y: { beginAtZero: true }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: { label: context => `${context.formattedValue} SP` }
                    }
                }
            }
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTeamStoryPointsChart);
    } else {
        initTeamStoryPointsChart();
    }
})();
</script>
{% endif %}
