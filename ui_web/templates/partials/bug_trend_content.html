<article class="block">
    <h2 class="title is-3">Bug Trend Indicator</h2>
    <form class="box" hx-get="{% url 'ui_web:bug_trend_chart' %}" hx-target="#bug-trend-chart-container" hx-swap="innerHTML" hx-indicator="#loading-indicator">
        <div class="columns is-align-items-end">
            <div class="column">
                <label class="label" for="bug-trend-scope">Scope</label>
                <div class="select is-fullwidth">
                    <select id="bug-trend-scope" name="scope_id">
                        {% for scope in scope_options %}
                            <option value="{{ scope.id }}" {% if scope.id == selected_scope_id %}selected{% endif %}>{{ scope.label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="column is-one-quarter">
                <label class="label" for="bug-trend-begin">Begin</label>
                <input class="input" id="bug-trend-begin" type="date" name="begin" value="{{ begin }}">
            </div>
            <div class="column is-one-quarter">
                <label class="label" for="bug-trend-end">End</label>
                <input class="input" id="bug-trend-end" type="date" name="end" value="{{ end }}">
            </div>
            <div class="column is-narrow">
                <button class="button is-primary" type="submit">Apply</button>
            </div>
        </div>
    </form>
    <div id="bug-trend-chart-container">
        {% include "partials/bug_trend_chart.html" %}
    </div>
    <div id="bug-trend-drilldown-container" class="mt-5"></div>
</article>
