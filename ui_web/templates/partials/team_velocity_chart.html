<section class="card chart-card" aria-labelledby="team-velocity-chart-title">
    <header class="card-header">
        <h3 class="card-header-title" id="team-velocity-chart-title">Velocity<span class="card-header-meta">SP per logged day{% if velocity_rolling_avg %} · {{ velocity_rolling_avg }}-month average{% endif %}</span></h3>
    </header>
    <div class="chart-card__body">
        {% if month_velocity %}
            <div class="chart-frame">
                <canvas id="teamVelocityChart" role="img" aria-label="Team velocity per month"></canvas>
            </div>
        {% else %}
            <div class="empty-state">
                <span class="empty-state__icon"><i class="iconoir-graph-up" aria-hidden="true"></i></span>
                <p class="empty-state__title">No velocity yet</p>
                <p class="empty-state__body">No resolved work with logged time was found in the last 12 months.</p>
            </div>
        {% endif %}
    </div>
</section>
{% if month_velocity %}
<script>
(function() {
    function initTeamVelocityChart() {
        if (typeof Chart === 'undefined') {
            setTimeout(initTeamVelocityChart, 100);
            return;
        }
        if (window.teamVelocityChartInstance) {
            window.teamVelocityChartInstance.destroy();
            window.teamVelocityChartInstance = null;
        }
        const canvas = document.getElementById('teamVelocityChart');
        if (!canvas) return;
        const chartData = {{ month_velocity|safe }};
        const lineColor = index => () => window.DashboardCharts.paletteColor(index);
        const areaColor = index => () => window.DashboardCharts.alpha(window.DashboardCharts.paletteColor(index), 0.08);
        window.teamVelocityChartInstance = new Chart(canvas.getContext('2d'), {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: chartData.data.map((item, index) => ({
                    label: item.developer,
                    data: item.metrics,
                    borderColor: lineColor(index),
                    pointBackgroundColor: lineColor(index),
                    backgroundColor: areaColor(index),
                    fill: 'origin',
                    tension: 0.3
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                onHover: window.DashboardVelocity.pointerOnHover,
                onClick: (event, elements) => {
                    if (elements.length) window.DashboardVelocity.openPeriod(chartData.labels[elements[0].index]);
                },
                scales: {
                    x: { grid: { display: false } },
                    y: { beginAtZero: true }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: { label: context => `${Number(context.parsed.y).toFixed(2)} SP/day` }
                    }
                }
            }
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTeamVelocityChart);
    } else {
        initTeamVelocityChart();
    }
})();
</script>
{% endif %}
