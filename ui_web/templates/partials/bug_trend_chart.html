<div class="bug-trend-chart-shell">
    {% if unavailable_reason %}
        <div class="notification is-warning">{{ unavailable_reason }}</div>
    {% endif %}
    <div class="bug-trend-legend" id="bugTrendLegend" aria-label="Chart series legend"></div>
    <canvas class="bug-trend-chart-canvas" id="bugTrendChart" width="900" height="360" data-testid="bug-trend-chart"></canvas>
</div>

<script>
(function() {
    window.initBugTrendChart = function initBugTrendChart() {
        if (typeof Chart === 'undefined') {
            setTimeout(initBugTrendChart, 100);
            return;
        }
        if (window.bugTrendChartInstance) {
            window.bugTrendChartInstance.destroy();
            window.bugTrendChartInstance = null;
        }
        const canvas = document.getElementById('bugTrendChart');
        if (!canvas) return;
        const chartData = {{ chart_json|safe }};
        if (!chartData || !chartData.labels || chartData.labels.length === 0) return;
        const themeStyles = getComputedStyle(document.documentElement);
        const chartTextColor = themeStyles.getPropertyValue('--bulma-text').trim() || '#dce3f7';
        const chartGridColor = themeStyles.getPropertyValue('--bulma-border').trim() || 'rgba(220, 227, 247, 0.18)';
        const readableSeriesLabel = value => String(value || '')
            .replace(/_/g, ' ')
            .replace(/\b\w/g, character => character.toUpperCase());
        const legend = document.getElementById('bugTrendLegend');
        if (legend) {
            legend.replaceChildren();
            chartData.datasets.forEach(dataset => {
                const item = document.createElement('span');
                item.className = 'bug-trend-legend-item';
                const swatch = document.createElement('span');
                swatch.className = 'bug-trend-legend-swatch';
                swatch.style.backgroundColor = dataset.color;
                const label = document.createElement('span');
                label.textContent = readableSeriesLabel(dataset.series_name);
                item.append(swatch, label);
                legend.appendChild(item);
            });
        }
        window.bugTrendChartInstance = new Chart(canvas.getContext('2d'), {
            type: 'bar',
            data: {
                labels: chartData.labels,
                datasets: chartData.datasets.map(dataset => ({
                    type: dataset.type,
                    label: dataset.series_name,
                    data: dataset.values,
                    borderColor: dataset.color,
                    backgroundColor: dataset.type === 'bar' ? dataset.color : 'transparent',
                    tension: 0.2,
                    fill: false
                }))
            },
            options: {
                responsive: true,
                interaction: { intersect: true, mode: 'nearest' },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        align: 'start',
                        labels: {
                            boxWidth: 10,
                            boxHeight: 10,
                            color: chartTextColor,
                            padding: 10,
                            usePointStyle: true,
                            generateLabels: chart => Chart.defaults.plugins.legend.labels.generateLabels(chart).map(item => ({
                                ...item,
                                text: readableSeriesLabel(item.text),
                            })),
                        },
                    },
                    tooltip: {
                        callbacks: {
                            label: context => `${readableSeriesLabel(context.dataset.label)}: ${context.formattedValue}`,
                        },
                    },
                },
                onClick: function(event, elements) {
                    if (!elements || elements.length === 0) return;
                    const point = elements[0];
                    const bucketId = chartData.bucket_ids[point.index];
                    const seriesName = chartData.datasets[point.datasetIndex].series_name;
                    const params = '?scope_id=' + encodeURIComponent(chartData.scope_id)
                        + '&run=' + encodeURIComponent(chartData.calculation_run_id)
                        + '&begin=' + encodeURIComponent('{{ begin }}')
                        + '&end=' + encodeURIComponent('{{ end }}')
                        + '&chart_id=' + encodeURIComponent(chartData.chart_id)
                        + '&bucket=' + encodeURIComponent(bucketId)
                        + '&series=' + encodeURIComponent(seriesName);
                    if (document.getElementById('workbench-grid')) {
                        const workbenchParams = new URLSearchParams(window.location.search);
                        new URLSearchParams(params).forEach((value, key) => workbenchParams.set(key, value));
                        const workbenchUrl = '{% url "ui_web:workbench" %}?' + workbenchParams.toString();
                        htmx.ajax('GET', workbenchUrl, {
                            target: '.workbench-shell',
                            select: '.workbench-shell',
                            swap: 'outerHTML'
                        });
                        window.history.pushState({}, '', workbenchUrl);
                        return;
                    }
                    htmx.ajax('GET', '{% url "ui_web:bug_trend_evidence" %}' + params, {
                        target: '#bug-trend-evidence-container',
                        swap: 'innerHTML'
                    });
                },
                scales: {
                    x: {
                        ticks: { color: chartTextColor },
                        grid: { color: chartGridColor },
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: chartTextColor },
                        grid: { color: chartGridColor },
                    }
                }
            }
        });
    };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.initBugTrendChart);
    } else {
        window.initBugTrendChart();
    }
})();
</script>
