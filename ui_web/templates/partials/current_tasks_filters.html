{% if task_filter_panel.fields %}
<form id="task-filters" class="task-filters box dashboard-tool-form dashboard-top-toolbar" aria-label="Task filters"
      method="get" action="{% url 'ui_web:partials_tasks' %}"
      hx-get="{% url 'ui_web:partials_tasks' %}" hx-target="#current-tasks-board" hx-push-url="true">
    <input type="hidden" name="member_group_id" value="{{ selected_member_group_id|default:'' }}">
    <input type="hidden" name="view" value="{{ view_mode|default:'list' }}">
    <div class="dashboard-tool-grid is-toolbar">
        {% for field in task_filter_panel.fields %}
        <div class="dashboard-tool-field">
            <label class="label" for="task-filter-{{ field.param }}">{{ field.label }}{% if field.param == "health" %}{% include "partials/help_tip.html" with label="Health filter" text="Health filtering requires forecast enrichment because the risk signal is calculated from task effort and estimate data." %}{% endif %}</label>
            <div class="select is-fullwidth">
                <select id="task-filter-{{ field.param }}" name="{{ field.param }}">
                    <option value="">All</option>
                    {% for option in field.options %}
                    <option value="{{ option.id }}"{% if option.selected %} selected{% endif %}>{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        {% endfor %}
        <div class="dashboard-tool-actions">
            <button type="submit" class="button is-primary">Apply</button>
            {% if task_filter_panel.has_active_selection %}
            <a class="button is-light" href="{% url 'ui_web:partials_tasks' %}?{{ view_queries.clear }}"
               hx-get="{% url 'ui_web:partials_tasks' %}?{{ view_queries.clear }}" hx-target="#current-tasks-board" hx-push-url="true">Clear</a>
            {% endif %}
        </div>
    </div>
</form>
{% endif %}
