{% for child_task in child_tasks %}
<tr class="is-child-row">
    {% include "partials/task_row_cells.html" with task=child_task is_child_row=True %}
</tr>
{% empty %}
<tr class="is-child-row">
    <td colspan="{{ task_table_colspan }}"><span class="has-text-grey-light">No subtasks found.</span></td>
</tr>
{% endfor %}
