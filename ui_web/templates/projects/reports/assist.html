{% load i18n %}
<section class="report-assist-dialog" data-report-assist-dialog hidden role="dialog" aria-labelledby="report-assist-title"
         data-ready="{% trans "Ready" %}"
         data-loading="{% trans "Preparing AI candidate..." %}"
         data-candidate-ready="{% trans "Candidate ready" %}"
         data-save-first="{% trans "Save your edits before requesting an AI candidate." %}"
         data-stale="{% trans "The editing target changed. This candidate cannot replace it." %}"
         data-invalid-target="{% trans "AI assistance is not available for this target." %}"
         data-unavailable="{% trans "AI assistance is unavailable. You can continue editing manually." %}"
         data-pending="{% trans "The existing AI request is unresolved. Check its status or cancel it." %}"
         data-limit="{% trans "AI observation limit reached. The request is unresolved; manual editing remains available." %}"
         data-expired="{% trans "AI deadline reached. The result is still unconfirmed." %}"
         data-insufficient="{% trans "The source does not contain enough evidence. Original text is unchanged." %}"
         data-canceled="{% trans "AI request canceled. Original text is unchanged." %}"
         data-failed="{% trans "AI request failed. Original text is unchanged." %}">
    <header class="report-assist-header">
        <h2 id="report-assist-title" class="report-assist-title">{% trans "AI assist" %}</h2>
        <button type="button" class="button is-small" data-report-assist-close aria-label="{% trans "Close" %}" title="{% trans "Close" %}">
            <span class="icon is-small" aria-hidden="true"><i class="iconoir-xmark"></i></span>
        </button>
    </header>
    <div class="dashboard-form-field">
        <label class="label" for="report-assist-instruction">{% trans "Request" %}</label>
        <textarea id="report-assist-instruction" class="textarea" data-report-assist-instruction rows="2" maxlength="1000" required></textarea>
    </div>
    <p data-report-assist-status role="status" aria-live="polite"></p>
    <div class="report-assist-preview paper" data-report-assist-preview hidden></div>
    <div class="dashboard-action-bar">
        <div class="dashboard-action-group">
            <button type="button" class="button is-small" data-report-assist-generate disabled>
                <span class="icon is-small" aria-hidden="true"><i class="iconoir-sparks"></i></span>
                <span>{% trans "Generate" %}</span>
            </button>
            <button type="button" class="button is-small is-primary" data-report-assist-apply hidden disabled>
                <span class="icon is-small" aria-hidden="true"><i class="iconoir-check"></i></span>
                <span>{% trans "Apply" %}</span>
            </button>
            <button type="button" class="button is-small" data-report-assist-check hidden>
                <span class="icon is-small" aria-hidden="true"><i class="iconoir-refresh-double"></i></span>
                <span>{% trans "Check status" %}</span>
            </button>
            <button type="button" class="button is-small" data-report-assist-cancel disabled>
                <span class="icon is-small" aria-hidden="true"><i class="iconoir-xmark"></i></span>
                <span>{% trans "Reject / cancel" %}</span>
            </button>
        </div>
    </div>
</section>
