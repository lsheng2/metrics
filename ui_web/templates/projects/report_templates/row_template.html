{% load i18n %}
<template data-template-row-template>
    <article class="box" data-template-row data-block-id="" data-slot-id="" data-kind="content">
        <div class="level is-mobile">
            <div class="level-left">
                <div class="select is-small">
                    <select data-template-kind aria-label="{% trans "Block type" %}">
                        <option value="content">{% trans "Content" %}</option>
                        <option value="slot">{% trans "Slot" %}</option>
                        <option value="data">{% trans "Data" %}</option>
                    </select>
                </div>
            </div>
            <div class="level-right buttons are-small">
                <button class="button" type="button" data-template-row-command="up" aria-label="{% trans "Move up" %}">↑</button>
                <button class="button" type="button" data-template-row-command="down" aria-label="{% trans "Move down" %}">↓</button>
                <button class="button is-danger is-light" type="button" data-template-row-command="remove" aria-label="{% trans "Remove block" %}">{% trans "Remove" %}</button>
            </div>
        </div>
        <div data-template-rich-panel>
            <label class="label" data-template-rich-label data-content-text="{% trans "Content" %}" data-slot-text="{% trans "Initial slot content" %}">{% trans "Rich text" %}</label>
            <div class="report-editor-surface" data-template-editor-surface tabindex="0" aria-label="{% trans "Rich text" %}"></div>
        </div>
        <div data-template-panel="content">
            <p class="help">{% trans "This fixed content is read only in reports." %}</p>
        </div>
        <div data-template-panel="slot">
            <div class="columns">
                <div class="column">
                    <label class="label">{% trans "Slot label" %}</label>
                    <input class="input" data-template-slot-label value="{% trans "Manual slot" %}">
                </div>
                <div class="column is-narrow">
                    <label class="checkbox mt-5"><input type="checkbox" data-template-slot-required> {% trans "Required" %}</label>
                </div>
                <div class="column">
                    <label class="label">{% trans "Fill mode" %}</label>
                    <div class="select is-fullwidth">
                        <select data-template-slot-fill-mode>
                            <option value="manual">{% trans "Manual" %}</option>
                            <option value="ai_optional">{% trans "AI optional" %}</option>
                        </select>
                    </div>
                </div>
            </div>
            <label class="label mt-2">{% trans "Optional AI instructions" %}</label>
            <textarea class="textarea" data-template-slot-instruction rows="2"></textarea>
        </div>
        <div data-template-panel="data">
            <div class="columns">
                <div class="column">
                    <label class="label">{% trans "Data source" %}</label>
                    <div class="select is-fullwidth">
                        <select data-template-data-source>
                            {% for value, label in editor.data_sources %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="column">
                    <label class="label">{% trans "Group by" %}</label>
                    <div class="select is-fullwidth">
                        <select data-template-data-group>
                            {% for value, label in editor.group_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="column is-narrow">
                    <label class="checkbox mt-5"><input type="checkbox" value="summary_time" data-template-data-column> {% trans "Summary time" %}</label>
                    <label class="checkbox mt-5"><input type="checkbox" value="source_hash" data-template-data-column> {% trans "Source hash" %}</label>
                </div>
            </div>
            <div data-template-matrix-panel>
                <label class="label">{% trans "Matrix groups" %}</label>
                <div class="select is-small">
                    <select data-template-matrix-group-mode>
                        <option value="none">{% trans "No manual groups" %}</option>
                        <option value="manual">{% trans "Manual groups" %}</option>
                    </select>
                </div>
                <div data-template-matrix-groups></div>
                <button class="button is-small mt-2" type="button" data-template-matrix-group-add>{% trans "Add group" %}</button>
            </div>
        </div>
    </article>
</template>
